[package]
name = "rooom-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rooom"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]
first-batch-smoke = []
first-batch-adapters = ["first-batch-smoke", "rooom-platform/adapter-fixtures"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
rooom-core = { path = "../crates/rooom-core" }
rooom-platform = { path = "../crates/rooom-platform", features = ["adapter-runtime"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "tray-icon"] }
tauri-plugin-global-shortcut = "=2.4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
